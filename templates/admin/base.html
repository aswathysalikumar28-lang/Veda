<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin — Veda{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--clay:#C4825A;--earth:#8B5E3C;--sage:#7A8C6E;--cream:#F5EFE0;--bark:#2E1F0F;--gold:#D4A847;--mist:#EDE4D3}
body{background:#f0ebe0;font-family:'Jost',sans-serif;font-weight:300;color:var(--bark)}

.sidebar{position:fixed;top:0;left:0;width:230px;height:100vh;background:var(--bark);display:flex;flex-direction:column;z-index:10}
.s-logo{padding:1.8rem 1.5rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.07)}
.s-logo a{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--cream);text-decoration:none}
.s-logo a span{color:var(--gold);font-style:italic}
.s-sub{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,239,224,.3);margin-top:.2rem}
.s-nav{flex:1;padding:1.2rem 0}
.s-nav a{display:flex;align-items:center;gap:.75rem;padding:.72rem 1.5rem;color:rgba(245,239,224,.45);text-decoration:none;font-size:.8rem;letter-spacing:.04em;transition:all .2s;border-left:2px solid transparent}
.s-nav a:hover{color:var(--cream);background:rgba(255,255,255,.04)}
.s-nav a.active{color:var(--cream);border-left-color:var(--clay);background:rgba(196,130,90,.1)}
.s-nav .ico{font-size:.95rem;width:1.2rem;text-align:center}
.s-foot{padding:1.2rem 1.5rem;border-top:1px solid rgba(255,255,255,.07)}
.s-foot a{font-size:.72rem;color:rgba(245,239,224,.3);text-decoration:none;transition:color .2s}
.s-foot a:hover{color:var(--cream)}

.main{margin-left:230px;min-height:100vh;padding:2rem 2.5rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.ph{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300}
.ph em{font-style:italic;color:var(--clay)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
.sc{background:white;padding:1.4rem;border-top:3px solid var(--clay)}
.sc.sn{border-color:#e8a87c}.sc.sf{border-color:var(--sage)}.sc.sd{border-color:#5a8c5a}
.sn-num{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:300;line-height:1}
.sn-label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#999;margin-top:.3rem}

.tw{background:white;overflow:hidden}
.th{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.5rem;border-bottom:1px solid #eee}
.tt{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:#aaa}
table{width:100%;border-collapse:collapse}
th{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#bbb;padding:.75rem 1.5rem;text-align:left;border-bottom:1px solid #f0f0f0;font-weight:400}
td{padding:.85rem 1.5rem;border-bottom:1px solid #f5f5f5;font-size:.87rem;color:var(--bark);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.tl{color:inherit;text-decoration:none}
.tl:hover{color:var(--clay)}

.badge{display:inline-block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .6rem;border-radius:2px}
.badge-new{background:rgba(232,168,124,.15);color:#b06830}
.badge-confirmed{background:rgba(122,140,110,.15);color:#3d6b31}
.badge-completed{background:rgba(90,140,90,.15);color:#2a6c2a}
.badge-cancelled{background:rgba(196,99,90,.12);color:#c4635a}

.filters{display:flex;gap:.8rem;align-items:center;margin-bottom:1.4rem;flex-wrap:wrap}
.fb{padding:.42rem .95rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid #ddd;background:white;cursor:pointer;text-decoration:none;color:var(--bark);transition:all .2s}
.fb:hover,.fb.active{background:var(--earth);color:var(--cream);border-color:var(--earth)}
.sb{padding:.42rem .85rem;border:1px solid #ddd;font-family:'Jost',sans-serif;font-size:.84rem;outline:none;color:var(--bark);flex:1;max-width:260px}
.sb:focus{border-color:var(--clay)}
.sf{display:flex;gap:.5rem;align-items:center}
.sbtn{padding:.42rem .85rem;background:var(--clay);color:white;border:none;cursor:pointer;font-size:.78rem}

.dg{display:grid;grid-template-columns:2fr 1fr;gap:1.4rem;align-items:start}
.dc{background:white;padding:1.7rem;margin-bottom:1rem}
.dc h3{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#bbb;margin-bottom:1.1rem}
.dr{display:flex;padding:.6rem 0;border-bottom:1px solid #f5f5f5;gap:1rem}
.dr:last-child{border-bottom:none}
.dk{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#bbb;min-width:125px;padding-top:.1rem}
.dv{font-size:.88rem;color:var(--bark);line-height:1.6;flex:1}
.mb{background:#fafaf8;padding:1rem;font-size:.88rem;line-height:1.8;color:#5a4030;margin-top:.5rem;font-style:italic}

.stf{display:flex;gap:.5rem;flex-wrap:wrap}
.stb{padding:.48rem .95rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid #ddd;background:white;cursor:pointer;font-family:'Jost',sans-serif;transition:all .2s}
.stb:hover{background:var(--earth);color:white;border-color:var(--earth)}
.stb.bn:hover{background:#b06830;border-color:#b06830}
.stb.bc:hover{background:var(--sage);border-color:var(--sage)}
.stb.bd:hover{background:#3a7a3a;border-color:#3a7a3a}
.stb.bx:hover{background:#c4635a;border-color:#c4635a}
.dbtn{padding:.48rem .95rem;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid #f0c0c0;background:white;cursor:pointer;font-family:'Jost',sans-serif;color:#c4635a;width:100%;margin-top:1rem;transition:all .2s}
.dbtn:hover{background:#c4635a;color:white}

.back{font-size:.73rem;letter-spacing:.1em;text-transform:uppercase;color:#bbb;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.4rem;transition:color .2s}
.back:hover{color:var(--clay)}
.empty{padding:3rem;text-align:center;color:#bbb;font-size:.88rem}
.qa{display:block;text-align:center;padding:.48rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid #ddd;text-decoration:none;color:var(--bark);margin-bottom:.6rem;transition:all .2s}
.qa:hover{background:var(--earth);color:white;border-color:var(--earth)}
</style>
</head>
<body>
<div class="sidebar">
  <div class="s-logo">
    <a href="{{ url_for('admin_dashboard') }}">Ve<span>da</span></a>
    <div class="s-sub">Admin Panel</div>
  </div>
  <nav class="s-nav">
    <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint=='admin_dashboard' %}active{% endif %}"><span class="ico">📊</span>Dashboard</a>
    <a href="{{ url_for('admin_bookings') }}" class="{% if request.endpoint in ['admin_bookings','admin_booking_detail'] %}active{% endif %}"><span class="ico">📋</span>All Bookings</a>
    <a href="{{ url_for('admin_bookings') }}?status=new"><span class="ico">🆕</span>New Requests</a>
    <a href="{{ url_for('admin_bookings') }}?status=confirmed"><span class="ico">✅</span>Confirmed</a>
    <a href="{{ url_for('home') }}" target="_blank"><span class="ico">🌿</span>View Website</a>
  </nav>
  <div class="s-foot"><a href="{{ url_for('admin_logout') }}">← Sign Out</a></div>
</div>
<div class="main">{% block content %}{% endblock %}</div>
</body>
</html>
